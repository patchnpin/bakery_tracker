<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧁 Bakery Story — Recipe Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ee;
    --warm-white: #fffaf4;
    --blush: #f2c4b0;
    --rose: #d97b6c;
    --mauve: #b5697a;
    --plum: #6b3a4d;
    --chocolate: #3d1f2b;
    --sage: #8aab8a;
    --sky: #a8c4d4;
    --gold: #c9964a;
    --gold-light: #f0d9b0;
    --text: #2d1b24;
    --text-mid: #6b4a58;
    --text-light: #a88899;
    --border: #e8d5c8;
    --shadow: rgba(61,31,43,0.08);
    --card-bg: #ffffff;
    --tag-unlocked: #d4edda;
    --tag-unlocked-text: #2d6a3f;
    --tag-completed: #c9964a22;
    --tag-completed-text: #6b4a1a;
    --tag-locked: #f0e0e5;
    --tag-locked-text: #8a3a50;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--chocolate);
    background-image: radial-gradient(ellipse at 20% 50%, #5c2a38 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 50%, #2a1020 0%, transparent 60%);
    color: var(--cream);
    padding: 28px 32px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .header-title {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .header-title h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--gold-light);
  }
  .header-title p {
    font-size: 0.82rem;
    color: var(--blush);
    font-weight: 300;
    letter-spacing: 0.3px;
  }
  .header-stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 6px 16px;
    text-align: center;
  }
  .stat-pill .num {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--gold-light);
    line-height: 1;
  }
  .stat-pill .lbl {
    font-size: 0.68rem;
    color: var(--blush);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  /* ── Tabs ── */
  .tabs {
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
    display: flex;
    padding: 0 24px;
    gap: 4px;
  }
  .tab-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-mid);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 14px 18px 12px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.2px;
  }
  .tab-btn:hover { color: var(--mauve); }
  .tab-btn.active {
    color: var(--plum);
    border-bottom-color: var(--rose);
    font-weight: 500;
  }

  /* ── Main Layout ── */
  .main {
    display: flex;
    height: calc(100vh - 140px);
    overflow: hidden;
  }

  /* ── Filters Sidebar ── */
  .sidebar {
    width: 260px;
    min-width: 220px;
    background: var(--warm-white);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex-shrink: 0;
  }
  .sidebar-section h3 {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-light);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .search-box {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    background: var(--cream);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-box:focus { border-color: var(--rose); }
  .search-box::placeholder { color: var(--text-light); }

  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .chip {
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--cream);
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--mauve); color: var(--mauve); }
  .chip.active {
    background: var(--plum);
    border-color: var(--plum);
    color: white;
  }

  .range-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .range-row label {
    font-size: 0.78rem;
    color: var(--text-mid);
  }
  .range-inputs {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .range-inputs input {
    width: 70px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.8rem;
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    outline: none;
  }
  .range-inputs input:focus { border-color: var(--rose); }
  .range-inputs span { color: var(--text-light); font-size: 0.8rem; }

  .toggle-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .toggle-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--text-mid);
    cursor: pointer;
  }
  .toggle-item input[type=checkbox] {
    accent-color: var(--rose);
    width: 14px;
    height: 14px;
  }

  select.filter-select {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    background: var(--cream);
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  select.filter-select:focus { border-color: var(--rose); }

  .clear-btn {
    width: 100%;
    padding: 8px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.12s;
  }
  .clear-btn:hover { border-color: var(--rose); color: var(--rose); }

  /* ── Recipe Grid ── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    background: var(--cream);
  }

  .results-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .results-count {
    font-size: 0.82rem;
    color: var(--text-light);
  }
  .sort-select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    background: var(--warm-white);
    color: var(--text);
    outline: none;
    cursor: pointer;
  }

  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }

  .recipe-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: box-shadow 0.15s, transform 0.15s;
    cursor: pointer;
    position: relative;
  }
  .recipe-card:hover {
    box-shadow: 0 4px 16px var(--shadow);
    transform: translateY(-1px);
  }
  .recipe-card.completed { border-left: 3px solid var(--gold); }
  .recipe-card.unlocked-not-done { border-left: 3px solid var(--sage); }
  .recipe-card.locked { opacity: 0.7; border-left: 3px solid var(--border); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--chocolate);
    line-height: 1.3;
    flex: 1;
  }
  .star-badge {
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .card-oven {
    font-size: 0.72rem;
    color: var(--text-light);
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  .card-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .meta-tag {
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 500;
    letter-spacing: 0.2px;
  }
  .tag-time {
    background: var(--gold-light);
    color: #7a5520;
  }
  .tag-type {
    background: #e8eef5;
    color: #3a5a7a;
  }
  .tag-color {
    border: 1px solid var(--border);
    background: white;
    color: var(--text-mid);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .color-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .tag-holiday {
    background: #fef3e2;
    color: #8a5a20;
  }
  .tag-season {
    background: #e8f5e8;
    color: #3a6a3a;
  }
  .tag-fav { background: #fce4ec; color: #880e4f; }
  .tag-ooglay { background: #fafafa; color: #9e9e9e; }

  .card-profit {
    font-size: 0.75rem;
    color: var(--text-light);
    margin-top: 2px;
  }

  .status-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }
  .status-completed { background: var(--tag-completed); color: var(--tag-completed-text); }
  .status-unlocked { background: var(--tag-unlocked); color: var(--tag-unlocked-text); }
  .status-locked { background: var(--tag-locked); color: var(--tag-locked-text); }

  /* ── Ovens Tab ── */
  .ovens-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .oven-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .oven-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    color: var(--chocolate);
  }
  .oven-count-row {
    display: flex;
    gap: 10px;
    font-size: 0.78rem;
    color: var(--text-mid);
  }
  .oven-count-row strong { color: var(--plum); }
  .progress-bar-wrap {
    background: var(--border);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--rose), var(--gold));
    transition: width 0.3s;
  }
  .progress-label {
    font-size: 0.72rem;
    color: var(--text-light);
    display: flex;
    justify-content: space-between;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }
  .empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(61,31,43,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--warm-white);
    border-radius: 16px;
    padding: 28px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(61,31,43,0.25);
    position: relative;
  }
  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--chocolate);
    margin-bottom: 4px;
  }
  .modal .modal-oven {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-bottom: 20px;
  }
  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .modal-field label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-light);
    display: block;
    margin-bottom: 3px;
  }
  .modal-field span {
    font-size: 0.9rem;
    color: var(--text);
    font-weight: 500;
  }
  .modal-edit-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  .modal-edit-row h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-light);
    font-weight: 500;
  }
  .modal-toggles {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toggle-btn {
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.12s;
  }
  .toggle-btn:hover { border-color: var(--mauve); }
  .toggle-btn.active-completed { background: var(--gold); border-color: var(--gold); color: white; }
  .toggle-btn.active-unlocked { background: var(--sage); border-color: var(--sage); color: white; }
  .toggle-btn.active-locked { background: var(--mauve); border-color: var(--mauve); color: white; }
  .toggle-btn.active-fav { background: #e91e8c; border-color: #e91e8c; color: white; }
  .toggle-btn.active-ooglay { background: #999; border-color: #999; color: white; }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--text-light);
    line-height: 1;
  }
  .modal-save {
    width: 100%;
    padding: 10px;
    background: var(--plum);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 14px;
  }
  .modal-save:hover { background: var(--chocolate); }

  /* ── Color dot mapping ── */
  .dot-Brown { background: #8B5E3C; }
  .dot-Black { background: #222; }
  .dot-Blue { background: #4a7abf; }
  .dot-Green { background: #5a9a5a; }
  .dot-Orange { background: #e8821a; }
  .dot-Pink { background: #e87ab0; }
  .dot-Purple { background: #8a5abf; }
  .dot-Rainbow { background: linear-gradient(90deg,red,orange,yellow,green,blue,purple); }
  .dot-Red { background: #c0392b; }
  .dot-Tan { background: #c8a97e; }
  .dot-Teal { background: #2aabb5; }
  .dot-White { background: #ddd; border: 1px solid #ccc; }
  .dot-Yellow { background: #e8c830; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--blush); }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .sidebar { width: 200px; min-width: 180px; }
    .recipe-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>🧁 Bakery Story</h1>
    <p>Recipe Tracker &amp; Finder</p>
  </div>
  <div class="header-stats" id="headerStats"></div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('recipes')">🍰 Recipes</button>
  <button class="tab-btn" onclick="switchTab('ovens')">🔥 Ovens</button>
  <button class="tab-btn" onclick="switchTab('finder')">🔍 Recipe Finder</button>
</div>

<div class="main" id="mainContainer">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3>Search</h3>
      <input class="search-box" type="text" id="searchInput" placeholder="Recipe or oven name…" oninput="applyFilters()">
    </div>

    <div class="sidebar-section">
      <h3>Status</h3>
      <div class="filter-chips" id="statusChips">
        <span class="chip active" data-status="all" onclick="toggleStatus(this)">All</span>
        <span class="chip" data-status="completed" onclick="toggleStatus(this)">⭐ Completed</span>
        <span class="chip" data-status="unlocked" onclick="toggleStatus(this)">🔓 Unlocked</span>
        <span class="chip" data-status="locked" onclick="toggleStatus(this)">🔒 Locked</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Ovens I Own</h3>
      <label class="toggle-item">
        <input type="checkbox" id="ownedOnly" onchange="applyFilters()">
        Only show ovens I have
      </label>
    </div>

    <div class="sidebar-section">
      <h3>Cook Time</h3>
      <div class="range-inputs">
        <input type="number" id="minHours" placeholder="Min h" min="0" oninput="applyFilters()">
        <span>–</span>
        <input type="number" id="maxHours" placeholder="Max h" min="0" oninput="applyFilters()">
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Color</h3>
      <div class="filter-chips" id="colorChips"></div>
    </div>

    <div class="sidebar-section">
      <h3>Holiday</h3>
      <div class="filter-chips" id="holidayChips"></div>
    </div>

    <div class="sidebar-section">
      <h3>Season</h3>
      <div class="filter-chips" id="seasonChips"></div>
    </div>

    <div class="sidebar-section">
      <h3>Food Type</h3>
      <select class="filter-select" id="typeSelect" onchange="applyFilters()">
        <option value="">All types</option>
      </select>
    </div>

    <div class="sidebar-section">
      <h3>Favorites</h3>
      <div class="filter-chips">
        <span class="chip" data-fav="all" onclick="toggleFav(this)">All</span>
        <span class="chip" data-fav="<3" onclick="toggleFav(this)">❤️ Favorites</span>
        <span class="chip" data-fav="ooglay" onclick="toggleFav(this)">😬 Ooglay</span>
      </div>
    </div>

    <button class="clear-btn" onclick="clearFilters()">✕ Clear all filters</button>
  </div>

  <!-- Content -->
  <div class="content" id="contentArea">
    <div class="results-bar">
      <span class="results-count" id="resultsCount"></span>
      <select class="sort-select" id="sortSelect" onchange="applyFilters()">
        <option value="name">Sort: Name A–Z</option>
        <option value="oven">Sort: Oven</option>
        <option value="hours_asc">Sort: Quickest first</option>
        <option value="hours_desc">Sort: Longest first</option>
        <option value="profit">Sort: Best profit/hour</option>
        <option value="status">Sort: Status</option>
      </select>
    </div>
    <div id="recipeGrid" class="recipe-grid"></div>
    <div id="ovenGrid" class="ovens-grid" style="display:none"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <button class="modal-close" onclick="closeModalBtn()">✕</button>
    <h2 id="modalName"></h2>
    <div class="modal-oven" id="modalOven"></div>
    <div class="modal-grid" id="modalGrid"></div>
    <div class="modal-edit-row">
      <h3>Update Status</h3>
      <div class="modal-toggles">
        <button class="toggle-btn" id="btnCompleted" onclick="setStatus('completed')">⭐ Completed (4★)</button>
        <button class="toggle-btn" id="btnUnlocked" onclick="setStatus('unlocked')">🔓 Unlocked</button>
        <button class="toggle-btn" id="btnLocked" onclick="setStatus('locked')">🔒 Locked</button>
      </div>
      <h3 style="margin-top:6px">Favorite?</h3>
      <div class="modal-toggles">
        <button class="toggle-btn" id="btnFav" onclick="setFav('<3')">❤️ Favorite</button>
        <button class="toggle-btn" id="btnOoglay" onclick="setFav('ooglay')">😬 Ooglay</button>
        <button class="toggle-btn" id="btnNeutral" onclick="setFav('')">— Neutral</button>
      </div>
      <button class="modal-save" onclick="saveModal()">Save Changes</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
// ── State ──
let activeTab = 'recipes';
let activeStatus = 'all';
let activeFav = 'all';
let activeColors = new Set();
let activeHolidays = new Set();
let activeSeasons = new Set();
let modalIndex = null;
let modalPending = {};

// Load overrides from localStorage
let overrides = {};
try { overrides = JSON.parse(localStorage.getItem('bs_overrides') || '{}'); } catch(e){}

function getRecipe(i) {
  const r = {...RECIPES[i]};
  if (overrides[i]) Object.assign(r, overrides[i]);
  return r;
}

// ── Init ──
function init() {
  buildChips('colorChips', ['Black','Blue','Brown','Green','Orange','Pink','Purple','Rainbow','Red','Tan','Teal','White','Yellow'], activeColors, toggleColor);
  buildChips('holidayChips', ['Christmas','Easter','Halloween','Independence Day','St Patricks Day','Thanksgiving',"Valentine's Day"], activeHolidays, toggleHoliday);
  buildChips('seasonChips', ['Fall','Spring','Summer','Winter'], activeSeasons, toggleSeason);

  const typeSelect = document.getElementById('typeSelect');
  ['Breads','Brownies','Cake Pops','Candies/Sweets','Coffees','Cold Drinks','Cookies','Cupcakes','Donuts','Hot Chocolates','Hot Teas','Ice Creams','Muffins','Multi Layer Cakes','Pancakes','Pastries','Pies','Puddings/Parfaits','Savory','Single Layer Cakes','Smoothies & Milkshakes','Tarts','Waffles'].forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    typeSelect.appendChild(o);
  });

  updateStats();
  applyFilters();
}

function buildChips(containerId, items, activeSet, toggleFn) {
  const el = document.getElementById(containerId);
  items.forEach(item => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = item;
    c.dataset.value = item;
    c.onclick = () => toggleFn(c, item, activeSet, containerId);
    el.appendChild(c);
  });
}

function toggleColor(el, val, set) {
  if (set.has(val)) { set.delete(val); el.classList.remove('active'); }
  else { set.add(val); el.classList.add('active'); }
  applyFilters();
}
function toggleHoliday(el, val, set) {
  if (set.has(val)) { set.delete(val); el.classList.remove('active'); }
  else { set.add(val); el.classList.add('active'); }
  applyFilters();
}
function toggleSeason(el, val, set) {
  if (set.has(val)) { set.delete(val); el.classList.remove('active'); }
  else { set.add(val); el.classList.add('active'); }
  applyFilters();
}

function toggleStatus(el) {
  document.querySelectorAll('#statusChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeStatus = el.dataset.status;
  applyFilters();
}

function toggleFav(el) {
  document.querySelectorAll('[data-fav]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeFav = el.dataset.fav;
  applyFilters();
}

// ── Filtering ──
function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const ownedOnly = document.getElementById('ownedOnly').checked;
  const minH = parseFloat(document.getElementById('minHours').value) || null;
  const maxH = parseFloat(document.getElementById('maxHours').value) || null;
  const typeVal = document.getElementById('typeSelect').value;
  const sort = document.getElementById('sortSelect').value;

  // build oven count lookup
  const ovenCountMap = {};
  OVENS.forEach(o => { ovenCountMap[o.name] = parseInt(o.total) || 0; });

  let results = RECIPES.map((r, i) => ({...r, ...overrides[i], _i: i}));

  results = results.filter(r => {
    if (!r.name) return false;
    if (search && !r.name.toLowerCase().includes(search) && !r.oven.toLowerCase().includes(search)) return false;
    if (activeStatus === 'completed' && !r.completed) return false;
    if (activeStatus === 'unlocked' && !(r.unlocked && !r.completed)) return false;
    if (activeStatus === 'locked' && r.unlocked) return false;
    if (ownedOnly) {
      const cnt = ovenCountMap[r.oven] || 0;
      if (cnt === 0) return false;
    }
    if (minH !== null && (r.hoursNum == null || r.hoursNum < minH)) return false;
    if (maxH !== null && (r.hoursNum == null || r.hoursNum > maxH)) return false;
    if (activeColors.size > 0 && !activeColors.has(r.color)) return false;
    if (activeHolidays.size > 0 && !activeHolidays.has(r.holiday)) return false;
    if (activeSeasons.size > 0 && !activeSeasons.has(r.season)) return false;
    if (typeVal && r.type !== typeVal) return false;
    if (activeFav === '<3' && r.fav !== '<3') return false;
    if (activeFav === 'ooglay' && r.fav !== 'ooglay') return false;
    return true;
  });

  // Sort
  results.sort((a,b) => {
    if (sort === 'name') return a.name.localeCompare(b.name);
    if (sort === 'oven') return a.oven.localeCompare(b.oven) || a.name.localeCompare(b.name);
    if (sort === 'hours_asc') return (a.hoursNum||999)-(b.hoursNum||999);
    if (sort === 'hours_desc') return (b.hoursNum||0)-(a.hoursNum||0);
    if (sort === 'profit') return (parseFloat(b.profitPerHour)||0)-(parseFloat(a.profitPerHour)||0);
    if (sort === 'status') {
      const sv = r => r.completed?0:r.unlocked?1:2;
      return sv(a)-sv(b)||a.name.localeCompare(b.name);
    }
    return 0;
  });

  renderRecipes(results);
  document.getElementById('resultsCount').textContent = `${results.length.toLocaleString()} recipe${results.length!==1?'s':''} found`;
}

function renderRecipes(list) {
  const grid = document.getElementById('recipeGrid');
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="emoji">🍽️</div><p>No recipes match your filters.</p></div>';
    return;
  }
  grid.innerHTML = list.map(r => recipeCardHTML(r, r._i)).join('');
}

function recipeCardHTML(r, i) {
  const completed = r.completed;
  const unlocked = r.unlocked;
  let cardClass = completed ? 'completed' : unlocked ? 'unlocked-not-done' : 'locked';
  let statusBadge = completed
    ? '<span class="status-badge status-completed">⭐ Done</span>'
    : unlocked
      ? '<span class="status-badge status-unlocked">🔓 Unlocked</span>'
      : '<span class="status-badge status-locked">🔒 Locked</span>';

  let tags = '';
  if (r.hoursLabel) tags += `<span class="meta-tag tag-time">⏱ ${r.hoursLabel}</span>`;
  if (r.type) tags += `<span class="meta-tag tag-type">${r.type}</span>`;
  if (r.color) tags += `<span class="meta-tag tag-color"><span class="color-dot dot-${r.color}"></span>${r.color}</span>`;
  if (r.holiday) tags += `<span class="meta-tag tag-holiday">${r.holiday}</span>`;
  if (r.season) tags += `<span class="meta-tag tag-season">${r.season}</span>`;
  if (r.fav === '<3') tags += `<span class="meta-tag tag-fav">❤️ Fav</span>`;
  if (r.fav === 'ooglay') tags += `<span class="meta-tag tag-ooglay">😬</span>`;

  return `<div class="recipe-card ${cardClass}" onclick="openModal(${i})">
    ${statusBadge}
    <div class="card-top">
      <span class="card-name">${r.name}</span>
    </div>
    <div class="card-oven">${r.oven}</div>
    <div class="card-meta">${tags}</div>
    ${r.profitPerHour ? `<div class="card-profit">💰 ${parseInt(r.profitPerHour).toLocaleString()} profit/hr</div>` : ''}
  </div>`;
}

// ── Ovens Tab ──
function renderOvens() {
  const grid = document.getElementById('ovenGrid');
  const validOvens = OVENS.filter(o => o.name && parseInt(o.totalRecipes) > 0);
  validOvens.sort((a,b) => a.name.localeCompare(b.name));

  grid.innerHTML = validOvens.map(o => {
    const total = parseInt(o.totalRecipes) || 0;
    const left = parseInt(o.recipesLeft) || 0;
    const done = total - left;
    const pct = total > 0 ? Math.round(done/total*100) : 0;
    const owned = parseInt(o.total) || 0;
    return `<div class="oven-card">
      <div class="oven-name">${o.name}</div>
      <div class="oven-count-row">
        <span>Owned: <strong>${owned}</strong> ${o.echo > 0 ? `(+${o.echo} echo)` : ''}</span>
        <span>Progress: <strong>${done}/${total}</strong></span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
      <div class="progress-label">
        <span>${pct}% mastered</span>
        <span>${left} left</span>
      </div>
    </div>`;
  }).join('');
}

// ── Modal ──
function openModal(i) {
  modalIndex = i;
  modalPending = {};
  const r = getRecipe(i);

  document.getElementById('modalName').textContent = r.name;
  document.getElementById('modalOven').textContent = r.oven;

  const fields = [
    ['Cook Time', r.hoursLabel || '—'],
    ['Cost', r.cost ? `${parseInt(r.cost).toLocaleString()} coins` : '—'],
    ['Revenue', r.revenue ? `${parseInt(r.revenue).toLocaleString()} coins` : '—'],
    ['Profit/Hr', r.profitPerHour ? `${parseInt(r.profitPerHour).toLocaleString()}` : '—'],
    ['Type', r.type || '—'],
    ['Color', r.color || '—'],
    ['Holiday', r.holiday || '—'],
    ['Season', r.season || '—'],
  ];

  document.getElementById('modalGrid').innerHTML = fields.map(([l,v]) =>
    `<div class="modal-field"><label>${l}</label><span>${v}</span></div>`
  ).join('');

  // Status buttons
  document.getElementById('btnCompleted').className = 'toggle-btn' + (r.completed ? ' active-completed' : '');
  document.getElementById('btnUnlocked').className = 'toggle-btn' + (r.unlocked && !r.completed ? ' active-unlocked' : '');
  document.getElementById('btnLocked').className = 'toggle-btn' + (!r.unlocked ? ' active-locked' : '');
  document.getElementById('btnFav').className = 'toggle-btn' + (r.fav === '<3' ? ' active-fav' : '');
  document.getElementById('btnOoglay').className = 'toggle-btn' + (r.fav === 'ooglay' ? ' active-ooglay' : '');
  document.getElementById('btnNeutral').className = 'toggle-btn' + (!r.fav ? ' active-locked' : '');

  document.getElementById('modalOverlay').classList.add('open');
}

function setStatus(s) {
  if (s === 'completed') { modalPending.completed = true; modalPending.unlocked = true; }
  else if (s === 'unlocked') { modalPending.completed = false; modalPending.unlocked = true; }
  else { modalPending.completed = false; modalPending.unlocked = false; }

  document.getElementById('btnCompleted').className = 'toggle-btn' + (s==='completed'?' active-completed':'');
  document.getElementById('btnUnlocked').className = 'toggle-btn' + (s==='unlocked'?' active-unlocked':'');
  document.getElementById('btnLocked').className = 'toggle-btn' + (s==='locked'?' active-locked':'');
}

function setFav(val) {
  modalPending.fav = val;
  document.getElementById('btnFav').className = 'toggle-btn' + (val==='<3'?' active-fav':'');
  document.getElementById('btnOoglay').className = 'toggle-btn' + (val==='ooglay'?' active-ooglay':'');
  document.getElementById('btnNeutral').className = 'toggle-btn' + (val===''?' active-locked':'');
}

function saveModal() {
  if (modalIndex === null) return;
  if (!overrides[modalIndex]) overrides[modalIndex] = {};
  Object.assign(overrides[modalIndex], modalPending);
  localStorage.setItem('bs_overrides', JSON.stringify(overrides));
  updateStats();
  applyFilters();
  closeModalBtn();
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
}
function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
  modalIndex = null;
}

// ── Stats ──
function updateStats() {
  const all = RECIPES.map((r,i) => getRecipe(i)).filter(r => r.name);
  const completed = all.filter(r => r.completed).length;
  const unlocked = all.filter(r => r.unlocked && !r.completed).length;
  const total = all.length;
  document.getElementById('headerStats').innerHTML = `
    <div class="stat-pill"><div class="num">${completed.toLocaleString()}</div><div class="lbl">Completed</div></div>
    <div class="stat-pill"><div class="num">${unlocked.toLocaleString()}</div><div class="lbl">In Progress</div></div>
    <div class="stat-pill"><div class="num">${total.toLocaleString()}</div><div class="lbl">Total</div></div>
  `;
}

// ── Tabs ──
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['recipes','ovens','finder'][i] === tab);
  });

  const sidebar = document.getElementById('sidebar');
  const recipeGrid = document.getElementById('recipeGrid');
  const ovenGrid = document.getElementById('ovenGrid');
  const resultsBar = document.querySelector('.results-bar');

  if (tab === 'recipes' || tab === 'finder') {
    sidebar.style.display = '';
    recipeGrid.style.display = '';
    ovenGrid.style.display = 'none';
    resultsBar.style.display = '';
    applyFilters();
  } else if (tab === 'ovens') {
    sidebar.style.display = 'none';
    recipeGrid.style.display = 'none';
    ovenGrid.style.display = '';
    resultsBar.style.display = 'none';
    renderOvens();
  }
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('ownedOnly').checked = false;
  document.getElementById('minHours').value = '';
  document.getElementById('maxHours').value = '';
  document.getElementById('typeSelect').value = '';
  activeStatus = 'all';
  activeColors.clear();
  activeHolidays.clear();
  activeSeasons.clear();
  activeFav = 'all';
  document.querySelectorAll('#statusChips .chip').forEach(c => c.classList.toggle('active', c.dataset.status==='all'));
  document.querySelectorAll('[data-fav]').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('#colorChips .chip, #holidayChips .chip, #seasonChips .chip').forEach(c => c.classList.remove('active'));
  applyFilters();
}

// Kick off
init();
</script>
</body>
</html>
